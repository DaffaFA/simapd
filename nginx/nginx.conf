events { worker_connections 1024; }

http {
  upstream backend  { server backend:3001; }
  upstream frontend { server frontend:3000; }

  # Timeout panjang untuk WebSocket
  proxy_read_timeout  3600s;
  proxy_send_timeout  3600s;

  server {
    listen 80;
    server_name _;

    # REST API — semua /api/ dan /health
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
      proxy_pass http://backend;
    }

    # WebSocket — NestJS Gateway namespace /stream
    # PENTING: harus sebelum location / agar tidak di-override
    location /stream {
      proxy_pass         http://backend:3001/stream;
      proxy_http_version 1.1;

      # Dua header ini WAJIB ada untuk WebSocket upgrade
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "Upgrade";

      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;

      # Timeout panjang agar koneksi WS tidak di-drop NGINX setelah idle
      proxy_read_timeout  86400s;
      proxy_send_timeout  86400s;
      proxy_connect_timeout 75s;
    }

    # Swagger
    location /api/docs {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # Next.js frontend (catch-all)
    location / {
      proxy_pass         http://frontend;
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      # HMR WebSocket untuk dev mode
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
    }
  }
}
